<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | Q&A</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="../css/qa.css">

</head>

<body>

    <header>

        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html" class="active">Q&A</a></li>
                <li><a onclick="goProfile()">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
               <li><a href="login.html" id="login-menu">LOGIN</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <div class="page-title">
            <h2>Q&A</h2>
        </div>

        <div class="top-bar">

            <div class="search-box">
                <input type="text" id="question-search" placeholder="질문을 검색하세요.">
                <button id="search-btn">
                    <i class="ti ti-search"></i>
                </button>
            </div>

            <select id="category-filter" class="category-select">
                <option value="">전체</option>
                <option value="CAREER">진로/취업</option>
                <option value="MAJOR">전공 선택</option>
                <option value="STUDY">학업/공부법</option>
                <option value="CERTIFICATE">자격증</option>
                <option value="ACTIVITY">인턴/대외활동</option>
                <option value="INTERVIEW">면접/자소서</option>
                <option value="JOB_INFO">직무 정보</option>
                <option value="CAMPUS">대학 생활</option>
                <option value="ETC">기타</option>
            </select>

            <button type="button" class="write-btn" id="question-upload-btn"
                onclick="window.location.href='question.html'">
                <i class="ti ti-edit"></i>
                질문하기
            </button>

        </div>

        <div class="question-list" id="question-list"></div>

    </div>

    </div>

    <!-- JavaScript -->
    <script src="../javascript/common.js"></script>
    <script src="../javascript/qa.js"></script>

</body>

</html>
