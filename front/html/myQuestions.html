<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | My Questions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/my-questions.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="../images/careeup_logo.png" alt="logo" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html" class="active">Q&A</a></li>
                <li><a onclick="goProfile()">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">

        <!-- 상단 -->
        <div class="page-title">
            <h2>내 질문</h2>
            <button class="write-btn" onclick="window.location.href='question.html'">+ 질문 작성</button>
        </div>

        <!-- 요약 -->
        <div class="summary">
            <div class="box">
                <span>전체 질문</span>
                <strong id="my-question-count">0</strong>
            </div>
            <div class="box">
                <span>답변 완료</span>
                <strong id="my-question-done">0</strong>
            </div>
            <div class="box">
                <span>미답변</span>
                <strong id="my-question-waiting">0</strong>
            </div>
        </div>

        <!-- 질문 리스트 -->
        <div class="question-list" id="my-question-list"></div>

    </div>

    <!-- JavaScript -->
    <script src="../javascript/common.js"></script>
    <script src="../javascript/my-questions.js"></script>
</body>

</html>
