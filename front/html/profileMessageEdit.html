<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | 한마디 수정</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="../css/profileMessageEdit.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()" class="active">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html">LOGIN</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-message"></i> 한마디 수정</h3>
            </div>

            <p class="guide">
                나의 프로필에 표시될 한 마디를 작성해주세요. (최대 100자)
            </p>

            <textarea id="message" maxlength="100" placeholder="예) 프로젝트 경험을 많이 쌓으면 취업에 큰 도움이 됩니다."></textarea>

            <div class="bottom-area">

                <span id="count">0 / 100</span>

                <div class="btn-group">
                    <button class="cancel-btn" onclick="history.back()">
                        취소
                    </button>

                    <button class="save-btn" onclick="saveMessage()">
                        저장
                    </button>
                </div>

            </div>

        </div>

    </div>

    <script src="../javascript/config.js"></script>
    <script src="../javascript/common.js"></script>
    <script src="../javascript/profileMessageEdit.js"></script>

</body>

</html>
