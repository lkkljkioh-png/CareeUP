<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareeUP | 비밀번호 찾기</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/findPassword.css">
</head>

<body>

    <div class="container">

        <!-- 왼쪽 패널 -->
        <div class="left-panel">

            <h1>Reset Password</h1>

            <p>
                비밀번호를 잊으셨나요?<br>
                가입한 아이디와 이메일을 입력하고<br>
                비밀번호를 다시 설정하세요.
            </p>

        </div>

        <!-- 오른쪽 -->
        <div class="right-panel">

            <div class="logo">
                <img src="../images/careeup_logo.png" alt="CareeUP 로고">
                <h1>CareeUP</h1>
            </div>

            <div class="card">

                <form id="find-password-form">

                    <!-- 아이디 -->
                    <div class="input-group">
                        <label for="user-id">아이디</label>
                        <input type="text" id="user-id" name="userId" placeholder="아이디를 입력하세요" required>
                    </div>

                    <!-- 이메일 -->
                    <div class="input-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <!-- 버튼 -->
                    <button type="submit" id="find-password-btn" class="find-btn">
                        다음
                    </button>

                </form>

                <div class="bottom-links">
                    <a href="login.html">로그인</a>
                    <a href="signup.html">회원가입</a>
                </div>

            </div>

        </div>

    </div>

    <script src="../javascript/findPassword.js"></script>

</body>

</html>
