<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | 프로필 수정</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="stylesheet" href="../css/profileEdit.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="location.href='main.html'">
            <span onclick="location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html" id="login-menu">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="edit-container">

            <h1>프로필 수정</h1>
            <p class="description">프로필에 표시할 정보를 입력해주세요.</p>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" disabled>
            </div>

            <div class="form-group">
                <label for="school">학교</label>
                <input type="text" id="school" placeholder="학교를 입력해주세요.">
            </div>

            <div class="form-group">
                <label for="department">학과</label>
                <input type="text" id="department" placeholder="학과를 입력해주세요.">
            </div>

            <!-- 재학생 -->
            <div id="student-fields">

                <div class="form-group">
                    <label for="grade">학년</label>

                    <select id="grade">
                        <option value="">학년 선택</option>
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                        <option value="4">4학년</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="desiredJob">희망 직무</label>
                    <input type="text" id="desiredJob" placeholder="예: 클라우드 엔지니어">
                </div>

            </div>

            <!-- 졸업생 -->
            <div id="graduate-fields">

                <div class="form-group">
                    <label for="graduationYear">졸업년도</label>
                    <input type="text" id="graduationYear" placeholder="예: 2025">
                </div>

                <div class="form-group">
                    <label for="company">회사</label>
                    <input type="text" id="company" placeholder="회사명을 입력해주세요.">
                </div>

                <div class="form-group">
                    <label for="position">직무</label>
                    <input type="text" id="position" placeholder="현재 직무를 입력해주세요.">
                </div>

            </div>

            <div class="form-group">
                <label for="techStack">기술 스택</label>
                <input type="text" id="techStack" placeholder="예: AWS, Java, Spring">
            </div>

            <div class="button-area">

                <button type="button" class="cancel-btn" onclick="goProfile()">
                    취소
                </button>

                <button type="button" class="save-btn" onclick="saveProfile()">
                    저장
                </button>

            </div>

        </div>

    </main>

    <script src="../javascript/common.js"></script>
    <script src="../javascript/profileEdit.js"></script>

</body>

</html>
