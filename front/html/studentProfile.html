<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | 재학생 프로필</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="../css/profile.css">

</head>

<body>

    <header>

        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()" class="active">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html" id="login-menu">LOGIN</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <!-- 프로필 -->

        <div class="profile-card">

            <div class="profile-image">
                <i class="ti ti-user"></i>
            </div>

            <div class="profile-info">

                <div class="profile-header">
                    <h2 id="student-name"></h2>

                    <button class="profile-edit-btn" onclick="location.href='profileEdit.html'">
                        <i class="ti ti-edit"></i>
                        프로필 수정
                    </button>
                </div>

                <table>

                    <tr>
                        <th>학교</th>
                        <td id="student-school"></td>
                    </tr>

                    <tr>
                        <th>학과</th>
                        <td id="student-dept"></td>
                    </tr>

                    <tr>
                        <th>학년</th>
                        <td id="grade"></td>
                    </tr>

                    <tr>
                        <th>희망 직무</th>
                        <td id="student-desired-job"></td>
                    </tr>

                    <tr>
                        <th>기술 스택</th>
                        <td id="student-tech-stack"></td>
                    </tr>

                </table>

            </div>

        </div>

        <!-- 프로젝트 -->

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-code"></i>프로젝트</h3>

                <button class="add-btn" onclick="location.href='studentProjectAdd.html'">

                    <i class="ti ti-plus"></i>
                    추가

                </button>
            </div>

            <div id="project-list">
            </div>

        </div>

        <!-- 자격증 -->

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-certificate"></i> 보유 자격증</h3>

                <button class="add-btn" onclick="location.href='studentCertificateAdd.html'">

                    <i class="ti ti-plus"></i>
                    추가
                </button>
            </div>

            <div id="certificate-list">
            </div>

        </div>

        <!-- 대외활동 -->

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-world"></i> 대외 활동</h3>

                <button class="add-btn" onclick="location.href='studentActivityAdd.html'">

                    <i class="ti ti-plus"></i>
                    추가
                </button>
            </div>

            <div id="activity-list">

                <div class="list-item">멋쟁이사자처럼</div>
                <div class="list-item">SW 중심대학 프로젝트</div>

            </div>

        </div>

        <!-- 자기소개 -->

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-message"></i> 한마디</h3>
                <button class="add-btn" onclick="window.location.href='profileMessageEdit.html'">
                    <i class="ti ti-edit"></i> 수정
                </button>
            </div>

            <p id="student-message">
            </p>

        </div>


    </div>

    <!-- JavaScript -->
    <script src="../javascript/common.js"></script>
    <script src="../javascript/profileMessage.js"></script>
    <script src="../javascript/studentProfile.js"></script>

</body>

</html>
