<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareeUP | 자격증 추가</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="stylesheet" href="../css/studentProjectAdd.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()" class="active">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html">LOGIN</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <div class="form-card">

            <div class="form-title">
                <div>
                    <h2>자격증 추가</h2>
                    <p>프로필에 표시할 자격증을 입력해주세요.</p>
                </div>

                <i class="ti ti-certificate"></i>
            </div>

            <div class="form-group">

                <label for="certificate-name">
                    자격증 이름
                </label>

                <input type="text" id="certificate-name" placeholder="예: AWS Certified Cloud Practitioner">

            </div>

            <div class="button-area">

                <button type="button" class="cancel-btn" onclick="history.back()">
                    취소
                </button>

                <button type="button" class="save-btn" onclick="saveCertificate()">
                    저장
                </button>

            </div>

        </div>

    </div>

    <script src="../javascript/common.js"></script>
    <script src="../javascript/graduateCertificateAdd.js"></script>

</body>

</html>
