<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | 졸업생 프로필</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="../css/profile.css">

</head>

<body>

    <header>

        <div class="logo">
            <img src="../images/careeup_logo.png" alt="로고" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()" class="active">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html">LOGIN</a></li>
            </ul>
        </nav>

    </header>

    <div class="container">

        <!-- 프로필 -->
        <div class="profile-card">
            <div class="profile-image"> <i class="ti ti-user"></i> </div>
            <div class="profile-info">
                <h2 id="graduate-name"></h2>
                <table>
                    <tr>
                        <th>졸업학교</th>
                        <td id="graduate-school"></td>
                    </tr>
                    <tr>
                        <th>졸업학과</th>
                        <td id="graduate-dept"></td>
                    </tr>
                    <tr>
                        <th>졸업년도</th>
                        <td id="graduate-year"></td>
                    </tr>
                    <tr>
                        <th>회사</th>
                        <td id="graduate-company"></td>
                    </tr>
                    <tr>
                        <th>직무</th>
                        <td id="graduate-position"></td>
                    </tr>
                    <tr>
                        <th>기술 스택</th>
                        <td id="graduate-tech-stack"></td>
                    </tr>
                </table>
            </div>
        </div>
        <!-- 경력 -->
        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-briefcase"></i> 경력</h3>
                <!-- 경력 -->
                <button class="add-btn" onclick="location.href='graduateExperienceAdd.html'">
                    <i class="ti ti-plus"></i> 추가
                </button>
            </div>

            <div id="experience-list">
            </div>

        </div>

        <!-- 자격증 -->
        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-certificate"></i> 보유 자격증</h3>
                <button class="add-btn" onclick="location.href='graduateCertificateAdd.html'">
                    <i class="ti ti-plus"></i> 추가
                </button>
            </div>

            <div id="certificate-list">
            </div>

        </div>

        <!-- 대외활동 -->
        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-world"></i> 대외 활동</h3>
                <button class="add-btn" onclick="location.href='graduateActivityAdd.html'">
                    <i class="ti ti-plus"></i> 추가
                </button>
            </div>

            <div id="external-activities-list">
            </div>

        </div>

        <!-- 한마디 -->

        <div class="card">

            <div class="card-title">
                <h3><i class="ti ti-message"></i> 한마디</h3>
                <button class="add-btn" onclick="window.location.href='profileMessageEdit.html'">
                    <i class="ti ti-edit"></i> 수정
                </button>
            </div>

            <p id="graduate-message">

            </p>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="../javascript/common.js"></script>
    <script src="../javascript/profileMessage.js"></script>
    <script src="../javascript/graduateProfile.js"></script>

</body>

</html>
