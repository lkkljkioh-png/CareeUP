<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareeUP | 프로필 탐색</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/profileList.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="../images/careeup_logo.png" alt="logo" onclick="window.location.href='main.html'">
            <span onclick="window.location.href='main.html'">CareeUP</span>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">MAIN</a></li>
                <li><a href="profileList.html" class="active">SEARCH</a></li>
                <li><a href="qa.html">Q&A</a></li>
                <li><a onclick="goProfile()">PROFILE</a></li>
                <li><a onclick="goMyPage()">MY</a></li>
                <li><a href="login.html" id="login-menu">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">

        <h2 class="title">프로필 탐색</h2>

        <!-- 검색 -->
        <div class="search-box">

            <input type="text" id="search-input" placeholder="이름, 회사, 직무, 학교, 학과 검색">

            <button type="button" onclick="searchProfiles()">
                검색
            </button>

        </div>

        <!-- 리스트 (더미데이터이므로 나중에 삭제 필요)
        <div class="profile-card">

            <div class="profile-left">
                <div class="avatar"></div>
            </div>

            <div class="profile-right">

                <div class="profile-top">
                    <div class="profile-info" id="graduate-info">
                        <h3 class="name" id="graduate-name">김유민</h3>
                        <p class="company" id="graduate-company">AWS</p>
                    </div>
                    <button class="detail-btn" onclick="goDetail()">자세히 보기</button>
                </div>

                <div class="tags">
                    <span class="university" id="graduate-school">서울대학교</span>
                    <span class="major" id="graduate-dept">컴퓨터공학</span>
                    <span class="graduationYear" id="graduate-year">2025</span>
                </div>

            </div>

        </div>
        -->

        <!-- 프로필 카드 템플릿 -->
        <template id="profile-template">

            <div class="profile-card">

                <div class="profile-left">
                    <div class="avatar"></div>
                </div>

                <div class="profile-right">

                    <div class="profile-top">

                        <div class="profile-info">
                            <h3 class="name"></h3>
                            <p class="company"></p>
                        </div>

                        <button class="detail-btn">
                            자세히 보기
                        </button>

                    </div>

                    <div class="tags">
                        <span class="university"></span>
                        <span class="major"></span>
                        <span class="graduationYear"></span>
                    </div>

                </div>

            </div>

        </template>

        <!-- 여기에 카드들이 생성됨 -->
        <div id="profile-list"></div>

        <!-- JavaScript -->
        <script src="../javascript/profileList.js"></script>
        <script src="../javascript/common.js"></script>

</body>

</html>
