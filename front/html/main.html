<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareeUP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body>

  <header>
    <div class="logo">
      <img src="../images/careeup_logo.png" alt="CareeUP 로고" onclick="window.location.href='main.html'">
      <span onclick="window.location.href='main.html'">CareeUP</span>
    </div>
    <nav>
      <ul>
        <li><a href="main.html" class="active">MAIN</a></li>
        <li><a href="profileList.html">SEARCH</a></li>
        <li><a href="qa.html">Q&A</a></li>
        <li><a onclick="goProfile()">PROFILE</a></li>
        <li><a onclick="goMyPage()">MY</a></li>
        <li><a href="login.html" id="login-menu">LOGIN</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">

    <div class="left-section">
      <span class="tag">CAREER NETWORK</span>
      <h2>Connect<br>your <span>career</span><br>journey.</h2>
      <p>선배와 후배를 잇는 커리어 네트워크.<br>경험을 나누고, 함께 성장하세요.</p>
    </div>

    <div class="right-section">

      <div class="start-card">

        <div class="start-icon">
          <i class="ti ti-route"></i>
        </div>

        <span class="start-label">START YOUR JOURNEY</span>

        <h3>당신의 커리어를<br>CareeUP과 함께하세요.</h3>

        <p class="start-description">
          재학생은 선배들의 경험을 탐색하고,<br>
          졸업생은 자신의 커리어를 공유할 수 있어요.
        </p>

        <div class="feature-list">

          <a href="profileList.html" class="feature">
            <i class="ti ti-search"></i>
            <span>졸업생 커리어 탐색</span>
            <i class="ti ti-chevron-right feature-arrow"></i>
          </a>

          <a href="qa.html" class="feature">
            <i class="ti ti-message-circle-question"></i>
            <span>선후배 Q&A</span>
            <i class="ti ti-chevron-right feature-arrow"></i>
          </a>

          <a href="#" class="feature" onclick="goProfile(); return false;">
            <i class="ti ti-user-check"></i>
            <span>나만의 프로필 관리</span>
            <i class="ti ti-chevron-right feature-arrow"></i>
          </a>

        </div>

        <button type="button" id="start-button" class="start-button" onclick="startCareeUP()">
          CareeUP 시작하기
          <i class="ti ti-arrow-right"></i>
        </button>

      </div>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="../javascript/common.js"></script>
  <script src="../javascript/main.js"></script>

</body>

</html>
